name: SpeechToTextLocal
options:
  bundleIdPrefix: com.speechtotextlocal
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
targets:
  SpeechToTextLocal:
    type: application
    platform: macOS
    sources:
      - path: SpeechToTextLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speechtotextlocal.app
        PRODUCT_NAME: SpeechToTextLocal
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Speech To Text Local
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Speech To Text Local needs the microphone to turn your voice into text.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Speech To Text Local uses on-device speech recognition to transcribe your voice privately.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SpeechToTextLocal/SpeechToTextLocal.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
  SpeechToTextLocalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SpeechToTextLocal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.speechtotextlocal.app.tests
schemes:
  SpeechToTextLocal:
    build:
      targets:
        SpeechToTextLocal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpeechToTextLocalTests
